<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocePreço · Telas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    /* palette pulled from the DocePreço logo */
    --pink:#EA4B92;        /* "Doce" magenta */
    --pink-600:#D8377F;
    --pink-700:#BC2A6C;
    --pink-100:#FFE3EF;
    --pink-50:#FFF0F6;
    --blue:#2BA7DD;        /* "Preço" blue */
    --blue-100:#DCF1FB;
    --blue-50:#EEF8FD;
    --yellow:#FFC53D;      /* coin / price-tag yellow */
    --yellow-100:#FFF1CE;
    --green:#43BE6E;       /* profit / money */
    --green-100:#DCF6E5;
    --cream:#FFF6F0;       /* app background (warm vanilla) */
    --cream-2:#FCEFE6;
    --ink:#3D2233;         /* dark plum text */
    --ink-2:#9A7E8C;       /* muted plum */
    --ink-3:#C4B0BB;
    --line:#F1E2DA;
    --card:#FFFFFF;
    --shadow:0 1px 2px rgba(61,34,51,.04), 0 8px 24px rgba(61,34,51,.07);
    --shadow-lg:0 2px 6px rgba(61,34,51,.05), 0 18px 40px rgba(61,34,51,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#F5EDE7;}

  /* ── screen shell ── */
  .app{height:100%;display:flex;flex-direction:column;background:var(--cream);
       font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);
       -webkit-font-smoothing:antialiased;position:relative;}
  .app *{box-sizing:border-box;}
  .scroll{flex:1;overflow:hidden;display:flex;flex-direction:column;}
  .body{flex:1;overflow:hidden;padding:0 18px;display:flex;flex-direction:column;gap:16px;}

  .head{font-family:'Baloo 2',cursive;}
  h1,h2,h3,h4{font-family:'Baloo 2',cursive;margin:0;font-weight:700;letter-spacing:.1px;color:var(--ink);}

  /* ── top bar ── */
  .topbar{padding:54px 18px 6px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .hi{font-size:13px;color:var(--ink-2);font-weight:600;line-height:1;}
  .topbar .name{font-family:'Baloo 2',cursive;font-size:23px;font-weight:700;line-height:1.15;margin-top:2px;white-space:nowrap;}
  .topbar .hi{white-space:nowrap;}
  .logo-badge{width:46px;height:46px;border-radius:15px;background:#fff;box-shadow:var(--shadow);
              display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .logo-badge img{width:100%;height:100%;object-fit:cover;transform:scale(1.55);}
  .chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;
        font-size:12.5px;font-weight:700;font-family:'DM Sans';}
  .chip-pro{background:linear-gradient(135deg,var(--yellow),#FFB01F);color:#7A4E00;
            box-shadow:0 4px 10px rgba(255,176,31,.35);}

  /* ── cards ── */
  .card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);}
  .pad{padding:16px;}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:2px 2px -2px;}
  .section-title h3{font-size:17px;white-space:nowrap;}
  .section-title .more{font-size:13px;font-weight:700;color:var(--pink);font-family:'DM Sans';}

  /* hero summary */
  .hero{border-radius:26px;padding:18px 18px 16px;color:#fff;position:relative;overflow:hidden;
        background:linear-gradient(140deg,#FF6AAE 0%,var(--pink) 52%,#C7367A 100%);
        box-shadow:0 16px 30px rgba(216,55,127,.32);}
  .hero .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.13);}
  .hero .label{font-size:13px;font-weight:600;opacity:.92;letter-spacing:.2px;}
  .hero .big{font-family:'Baloo 2',cursive;font-size:38px;font-weight:800;line-height:1;margin-top:6px;letter-spacing:.3px;}
  .hero .sub{font-size:13px;opacity:.9;margin-top:7px;font-weight:500;}
  .hero-stats{display:flex;gap:10px;margin-top:16px;}
  .hero-stat{flex:1;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
             border-radius:15px;padding:10px 12px;backdrop-filter:blur(4px);}
  .hero-stat .n{font-family:'Baloo 2',cursive;font-size:20px;font-weight:700;line-height:1;}
  .hero-stat .t{font-size:11.5px;opacity:.92;margin-top:4px;font-weight:500;}

  /* quick actions */
  .qa{display:flex;gap:10px;}
  .qa-item{flex:1;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:13px 8px 11px;
           display:flex;flex-direction:column;align-items:center;gap:8px;}
  .qa-ico{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .qa-item .qt{font-size:11.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.15;}

  /* 7-day chart */
  .chart{display:flex;align-items:flex-end;gap:8px;height:96px;padding:6px 2px 0;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;}
  .bar{width:100%;max-width:20px;border-radius:7px 7px 4px 4px;background:var(--pink-100);}
  .bar.on{background:linear-gradient(180deg,#FF6AAE,var(--pink));}
  .bar-d{font-size:10.5px;color:var(--ink-2);font-weight:600;}

  /* sale rows */
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;}
  .row+.row{border-top:1px solid var(--line);}
  .thumb{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;
         justify-content:center;font-family:'Baloo 2';font-weight:700;font-size:18px;color:#fff;}
  .row .rt{flex:1;min-width:0;}
  .row .rt b{font-size:14.5px;font-weight:700;font-family:'DM Sans';display:block;line-height:1.2;}
  .row .rt span{font-size:12px;color:var(--ink-2);font-weight:500;}
  .row .amt{font-family:'Baloo 2';font-weight:700;font-size:15.5px;color:var(--green);white-space:nowrap;}

  /* banner */
  .banner{border-radius:20px;padding:15px 16px;display:flex;align-items:center;gap:13px;
          background:linear-gradient(120deg,var(--blue-50),#fff);border:1px solid var(--blue-100);}
  .banner .bt b{font-family:'Baloo 2';font-size:15px;display:block;line-height:1.2;}
  .banner .bt span{font-size:12px;color:var(--ink-2);font-weight:500;}

  /* ── tab bar ── */
  .tabbar{display:flex;align-items:center;justify-content:space-around;padding:10px 14px 30px;
          background:rgba(255,255,255,.86);backdrop-filter:blur(14px);
          border-top:1px solid var(--line);position:relative;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;color:var(--ink-3);}
  .tab.on{color:var(--pink);}
  .tab .tl{font-size:10.5px;font-weight:700;font-family:'DM Sans';}
  .tab-fab{width:54px;height:54px;border-radius:18px;background:linear-gradient(140deg,#FF6AAE,var(--pink));
           display:flex;align-items:center;justify-content:center;margin-top:-22px;
           box-shadow:0 10px 20px rgba(216,55,127,.4);border:3px solid var(--cream);}

  /* ── recipes list ── */
  .searchbar{display:flex;align-items:center;gap:9px;background:#fff;border-radius:15px;padding:11px 14px;
             box-shadow:var(--shadow);color:var(--ink-2);font-size:14.5px;font-weight:500;}
  .filters{display:flex;gap:8px;overflow:hidden;}
  .pill{height:32px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;
        font-size:13px;font-weight:600;background:#fff;color:var(--ink-2);box-shadow:var(--shadow);white-space:nowrap;}
  .pill.on{background:var(--ink);color:#fff;}
  .quota{display:flex;align-items:center;gap:10px;background:var(--yellow-100);border-radius:14px;padding:10px 14px;}
  .quota .track{flex:1;height:7px;border-radius:99px;background:#fff;overflow:hidden;}
  .quota .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--yellow),#FF9E2C);}
  .quota .qn{font-size:12px;font-weight:700;color:#8A5A00;white-space:nowrap;}

  .rcard{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;gap:0;}
  .rcard .rimg{width:90px;flex-shrink:0;position:relative;}
  .rcard .rinfo{flex:1;padding:13px 14px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px;}
  .rcard .rname{font-family:'Baloo 2';font-weight:700;font-size:16.5px;line-height:1.1;}
  .rcard .rmeta{display:flex;gap:13px;}
  .rcard .rmeta .m .ml{font-size:10.5px;color:var(--ink-2);font-weight:600;line-height:1;}
  .rcard .rmeta .m .mv{font-family:'Baloo 2';font-weight:700;font-size:15px;line-height:1.1;margin-top:3px;white-space:nowrap;}
  .tag-margin{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;
              background:var(--green-100);color:#1F8A48;}

  /* photo placeholder */
  .ph{background:
        repeating-linear-gradient(45deg,var(--cream-2) 0 9px,#FBE7DB 9px 18px);
      display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;}
  .ph .cap{font-family:'DM Mono',ui-monospace,monospace;font-size:8.5px;color:#C9A893;
           background:rgba(255,255,255,.7);padding:2px 6px;border-radius:5px;letter-spacing:.2px;}

  /* ── cost screen ── */
  .cost-hero{height:158px;position:relative;border-radius:0 0 26px 26px;overflow:hidden;}
  .cost-back{position:absolute;top:54px;left:16px;z-index:3;width:38px;height:38px;border-radius:12px;
             background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .cost-title-wrap{padding:14px 18px 2px;}
  .cost-title-wrap h1{font-size:25px;line-height:1.1;}
  .cost-title-wrap .csub{font-size:13px;color:var(--ink-2);font-weight:600;margin-top:3px;}

  .ledger{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;}
  .lhead{padding:13px 16px 9px;display:flex;align-items:center;justify-content:space-between;}
  .lhead h4{font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .lrow{display:flex;align-items:center;gap:11px;padding:9px 16px;}
  .lrow+.lrow{border-top:1px solid var(--line);}
  .lrow .ldot{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
              font-family:'Baloo 2';font-size:13px;font-weight:700;}
  .lrow .ln{flex:1;min-width:0;}
  .lrow .ln b{font-size:14px;font-weight:600;font-family:'DM Sans';display:block;line-height:1.2;}
  .lrow .ln span{font-size:11.5px;color:var(--ink-2);font-weight:500;}
  .lrow .lv{font-family:'DM Sans';font-weight:700;font-size:14px;white-space:nowrap;}
  .lsum{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--cream);}
  .lsum .lt{font-weight:600;font-size:13.5px;color:var(--ink-2);}
  .lsum .lvv{font-family:'Baloo 2';font-weight:700;font-size:17px;}

  /* margin slider */
  .margin-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:15px 16px;}
  .margin-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
  .margin-top .ml{font-size:14px;font-weight:600;color:var(--ink);}
  .margin-top .mv{font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--pink);}
  .slider{height:10px;border-radius:99px;background:var(--pink-100);position:relative;}
  .slider .sf{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#FF6AAE,var(--pink));}
  .slider .sk{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;
              transform:translate(-50%,-50%);box-shadow:0 4px 10px rgba(216,55,127,.4);border:3px solid var(--pink);}
  .slider-scale{display:flex;justify-content:space-between;margin-top:9px;font-size:10.5px;color:var(--ink-3);font-weight:600;}

  /* result */
  .result{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;
          background:linear-gradient(140deg,#34C97B 0%,var(--green) 60%,#2BA060 100%);
          box-shadow:0 16px 30px rgba(67,190,110,.34);}
  .result .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.13);}
  .result .rl{font-size:13px;font-weight:600;opacity:.92;}
  .result .rprice{font-family:'Baloo 2';font-size:42px;font-weight:800;line-height:1;margin-top:5px;letter-spacing:.4px;}
  .result-grid{display:flex;gap:10px;margin-top:15px;}
  .result-grid .rg{flex:1;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px;}
  .result-grid .rg .n{font-family:'Baloo 2';font-weight:700;font-size:17px;line-height:1;}
  .result-grid .rg .t{font-size:11px;opacity:.92;margin-top:4px;font-weight:500;}

  .actions{display:flex;gap:10px;}
  .btn{height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;
       font-family:'Baloo 2';font-weight:700;font-size:15px;}
  .actions>.btn{flex:1;}
  .btn-primary{background:linear-gradient(140deg,#FF6AAE,var(--pink));color:#fff;box-shadow:0 10px 20px rgba(216,55,127,.35);}
  .btn-ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow);}

  /* ── paywall ── */
  .pw-hero{position:relative;overflow:hidden;padding:54px 22px 26px;text-align:center;color:#fff;
           background:linear-gradient(160deg,#FF6AAE 0%,var(--pink) 48%,#B92C6B 100%);
           border-radius:0 0 30px 30px;}
  .pw-hero .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);}
  .pw-close{position:absolute;top:54px;right:18px;width:34px;height:34px;border-radius:11px;
            background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;z-index:3;}
  .pw-crown{width:62px;height:62px;border-radius:20px;margin:6px auto 14px;
            background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
            display:flex;align-items:center;justify-content:center;}
  .pw-hero h1{color:#fff;font-size:27px;line-height:1.12;letter-spacing:.2px;}
  .pw-hero p{font-size:14px;opacity:.94;margin:8px 16px 0;font-weight:500;line-height:1.4;}

  .plans{display:flex;gap:11px;}
  .plan{flex:1;background:#fff;border-radius:20px;padding:15px 14px;border:2px solid var(--line);position:relative;}
  .plan.on{border-color:var(--pink);box-shadow:0 10px 22px rgba(216,55,127,.16);}
  .plan .pn{font-size:13px;font-weight:700;color:var(--ink-2);}
  .plan .pp{font-family:'Baloo 2';font-weight:800;font-size:26px;line-height:1;margin-top:7px;}
  .plan .pp small{font-size:13px;font-weight:600;color:var(--ink-2);}
  .plan .pper{font-size:12px;color:var(--ink-2);font-weight:500;margin-top:4px;}
  .plan .save{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;
              background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;
              box-shadow:0 4px 10px rgba(67,190,110,.4);}
  .plan .radio{position:absolute;top:13px;right:13px;width:20px;height:20px;border-radius:50%;
               border:2px solid var(--ink-3);}
  .plan.on .radio{border-color:var(--pink);background:var(--pink);
                  display:flex;align-items:center;justify-content:center;}

  .feat-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:6px 16px;}
  .feat{display:flex;align-items:center;gap:12px;padding:11px 0;}
  .feat+.feat{border-top:1px solid var(--line);}
  .feat .fc{width:26px;height:26px;border-radius:9px;background:var(--green-100);flex-shrink:0;
            display:flex;align-items:center;justify-content:center;}
  .feat b{font-size:14.5px;font-weight:600;font-family:'DM Sans';flex:1;line-height:1.2;}
  .pw-foot{text-align:center;font-size:12px;color:var(--ink-2);font-weight:500;line-height:1.5;}
  .pw-links{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--blue);
            font-weight:700;font-size:13.5px;}

  /* PRO locked features on Home */
  .pro-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .pro-tile{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px 14px 13px;
            position:relative;cursor:pointer;border:1px solid transparent;transition:transform .12s,border-color .12s;}
  .pro-tile:active{transform:scale(.97);border-color:var(--pink-100);}
  .pro-ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;}
  .pro-tile b{font-size:14px;font-weight:700;font-family:'DM Sans';display:block;line-height:1.15;}
  .pro-tile span{font-size:11px;color:var(--ink-2);font-weight:500;line-height:1.25;display:block;margin-top:2px;}
  .pro-lock{position:absolute;top:11px;right:11px;width:22px;height:22px;border-radius:7px;
            background:var(--yellow-100);display:flex;align-items:center;justify-content:center;}
  .pro-head{display:flex;align-items:center;gap:7px;margin:2px 2px -2px;}
  .pro-head h3{font-size:17px;}
  .pro-head .pb{font-size:10.5px;font-weight:800;color:#8A5A00;background:var(--yellow-100);padding:2px 8px;border-radius:99px;letter-spacing:.3px;}

  .pro-cta{display:flex;align-items:center;gap:12px;border-radius:20px;padding:15px 16px;cursor:pointer;
           background:linear-gradient(120deg,#FFF1CE,#FFE3EF);border:1px solid var(--pink-100);}
  .pro-cta .pc-ico{width:44px;height:44px;border-radius:14px;flex-shrink:0;background:#fff;
                   display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .pro-cta .pc-t b{font-family:'Baloo 2';font-size:15.5px;display:block;line-height:1.15;}
  .pro-cta .pc-t span{font-size:12px;color:var(--ink-2);font-weight:500;}
  .pro-cta .pc-go{margin-left:auto;color:var(--pink);}

  /* paywall slide-up sheet */
  .pw-sheet{position:absolute;inset:0;z-index:100;background:var(--cream);overflow:hidden;
            display:flex;flex-direction:column;}
  .pw-backdrop{position:absolute;inset:0;z-index:99;background:rgba(61,34,51,.35);}
  @keyframes pwUp{from{transform:translateY(101%)}to{transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .tap{cursor:pointer;}

  /* ════ shared building blocks for the rest of the app ════ */
  /* sub-screen header: back + title (+ optional action) */
  .sh{display:flex;align-items:center;gap:12px;padding:54px 16px 10px;}
  .sh .bk{width:38px;height:38px;border-radius:12px;background:#fff;box-shadow:var(--shadow);
          display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sh .sh-t{flex:1;min-width:0;}
  .sh .sh-t h1{font-size:22px;line-height:1.1;}
  .sh .sh-t .ssub{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:1px;}
  .sh .sh-act{display:flex;gap:8px;}
  .sh .act-pill{height:38px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;
                font-weight:700;font-size:13.5px;background:#fff;box-shadow:var(--shadow);color:var(--ink);}

  /* form fields */
  .field{display:flex;flex-direction:column;gap:7px;}
  .field>label{font-size:13px;font-weight:700;color:var(--ink);margin-left:2px;}
  .input{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px 15px;
         font-family:'DM Sans';font-size:15px;color:var(--ink);display:flex;align-items:center;gap:10px;}
  .input .ph-txt{color:var(--ink-3);}
  .input.area{align-items:flex-start;min-height:74px;}
  .input .suffix{margin-left:auto;color:var(--ink-2);font-weight:700;font-size:13px;}
  .field .hint{font-size:11.5px;color:var(--ink-2);font-weight:500;margin-left:2px;}
  .two{display:flex;gap:11px;}
  .two>*{flex:1;}

  /* unit / preset grid */
  .ugrid{display:flex;gap:8px;flex-wrap:wrap;}
  .uchip{height:40px;min-width:46px;padding:0 14px;border-radius:12px;background:#fff;box-shadow:var(--shadow);
         display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;color:var(--ink-2);}
  .uchip.on{background:var(--pink);color:#fff;box-shadow:0 6px 14px rgba(216,55,127,.3);}

  /* preset margin cards */
  .preset-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
  .preset{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:11px 10px;text-align:center;border:2px solid transparent;}
  .preset.on{border-color:var(--pink);background:var(--pink-50);}
  .preset .pp{font-family:'Baloo 2';font-weight:800;font-size:19px;line-height:1;color:var(--pink);}
  .preset .pl{font-size:10.5px;color:var(--ink-2);font-weight:600;margin-top:3px;}

  /* generic grouped card + rows */
  .gcard{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
  .grow{display:flex;align-items:center;gap:12px;padding:13px 15px;}
  .grow+.grow{border-top:1px solid var(--line);}
  .grow .gi{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .grow .gt{flex:1;min-width:0;}
  .grow .gt b{font-size:14.5px;font-weight:700;font-family:'DM Sans';display:block;line-height:1.2;}
  .grow .gt span{font-size:12px;color:var(--ink-2);font-weight:500;}
  .grow .gv{font-family:'Baloo 2';font-weight:700;font-size:15px;white-space:nowrap;}
  .grow .gact{display:flex;gap:6px;}
  .icobtn{width:32px;height:32px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;}

  /* segmented filters */
  .seg{display:flex;background:var(--cream-2);border-radius:13px;padding:4px;gap:3px;}
  .seg .opt{flex:1;text-align:center;padding:8px 6px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--ink-2);}
  .seg .opt.on{background:#fff;color:var(--pink);box-shadow:var(--shadow);}

  /* badges */
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;}
  .b-green{background:var(--green-100);color:#1F8A48;}
  .b-pink{background:var(--pink-100);color:var(--pink-700);}
  .b-yellow{background:var(--yellow-100);color:#8A5A00;}
  .b-blue{background:var(--blue-100);color:#1A6F96;}
  .b-gray{background:var(--cream-2);color:var(--ink-2);}

  /* switch */
  .switch{width:46px;height:28px;border-radius:99px;background:var(--ink-3);position:relative;flex-shrink:0;}
  .switch.on{background:var(--green);}
  .switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s;}
  .switch.on .knob{left:21px;}

  /* floating add button */
  .fab{position:absolute;right:18px;bottom:30px;width:58px;height:58px;border-radius:19px;z-index:40;
       background:linear-gradient(140deg,#FF6AAE,var(--pink));display:flex;align-items:center;justify-content:center;
       box-shadow:0 12px 24px rgba(216,55,127,.42);}

  /* empty state */
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 24px;}
  .empty .ei{width:72px;height:72px;border-radius:24px;background:var(--pink-50);display:flex;align-items:center;justify-content:center;}
  .empty h3{font-size:18px;}
  .empty p{font-size:13px;color:var(--ink-2);font-weight:500;margin:0;max-width:240px;line-height:1.45;}

  /* auth */
  .auth-hero{background:linear-gradient(160deg,#FF6AAE 0%,var(--pink) 52%,#C7367A 100%);
             border-radius:0 0 34px 34px;padding:70px 28px 34px;text-align:center;color:#fff;position:relative;overflow:hidden;}
  .auth-hero .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);}
  .auth-logo{width:96px;height:96px;border-radius:30px;background:#fff;margin:0 auto 16px;overflow:hidden;
             box-shadow:0 12px 26px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;}
  .auth-logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.5);}
  .auth-hero h1{color:#fff;font-size:26px;line-height:1.1;}
  .auth-hero p{font-size:14px;opacity:.94;margin:7px 0 0;font-weight:500;}
  .link{color:var(--pink);font-weight:700;font-size:14px;}
  .divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px;font-weight:600;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}

  /* code inputs */
  .code-row{display:flex;gap:9px;justify-content:center;}
  .code-box{width:46px;height:56px;border-radius:14px;background:#fff;box-shadow:var(--shadow);
            display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:700;font-size:24px;color:var(--ink);}
  .code-box.fill{border:2px solid var(--pink);}

  /* onboarding */
  .ob-art{height:300px;border-radius:28px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .dots{display:flex;gap:8px;justify-content:center;}
  .dots .d{width:8px;height:8px;border-radius:99px;background:var(--ink-3);}
  .dots .d.on{width:24px;background:var(--pink);}

  /* chat */
  .bubble{max-width:74%;padding:11px 14px;border-radius:18px;font-size:14px;font-weight:500;line-height:1.4;}
  .bubble.them{background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:5px;align-self:flex-start;color:var(--ink);}
  .bubble.me{background:linear-gradient(135deg,#FF6AAE,var(--pink));color:#fff;border-bottom-right-radius:5px;align-self:flex-end;}
  .btime{font-size:10px;color:var(--ink-3);font-weight:600;margin-top:3px;}
  .typing{display:flex;gap:4px;align-items:center;background:#fff;box-shadow:var(--shadow);padding:13px 16px;border-radius:18px;border-bottom-left-radius:5px;align-self:flex-start;}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:block;}
  .chat-input{display:flex;align-items:center;gap:10px;padding:12px 16px 30px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-top:1px solid var(--line);}
  .chat-input .ci-field{flex:1;background:var(--cream);border-radius:99px;padding:11px 16px;color:var(--ink-3);font-size:14px;}
  .chat-send{width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,#FF6AAE,var(--pink));display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* steps (beginner guide) */
  .step{display:flex;gap:14px;position:relative;}
  .step .snum{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
              font-family:'Baloo 2';font-weight:800;font-size:18px;z-index:2;}
  .step .sbody{flex:1;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px;}
  .step .conn{position:absolute;left:20px;top:42px;bottom:-18px;width:2px;background:var(--line);z-index:1;}

  /* qr */
  .qr{width:180px;height:180px;border-radius:18px;background:#fff;box-shadow:var(--shadow);margin:0 auto;padding:14px;}
  .qr svg{width:100%;height:100%;}

  /* report bars */
  .rbars{display:flex;align-items:flex-end;gap:9px;height:120px;padding-top:6px;}
  .rbars .rb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .rbars .rb .bar2{width:100%;border-radius:7px 7px 3px 3px;background:var(--blue-100);}
  .rbars .rb .bar2.on{background:linear-gradient(180deg,#FF6AAE,var(--pink));}
  .rbars .rb small{font-size:10px;color:var(--ink-2);font-weight:600;}

  /* color swatches (pdf settings) */
  .swatches{display:flex;gap:10px;flex-wrap:wrap;}
  .sw{width:42px;height:42px;border-radius:13px;position:relative;box-shadow:var(--shadow);}
  .sw.on::after{content:'';position:absolute;inset:-3px;border-radius:16px;border:2.5px solid var(--ink);}
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>

        </DCSection>

          <DCArtboard id="createseason" label="Nova época" width={402} height={700}><Phone h={700}><CreateSeasonScreen/></Phone></DCArtboard>
        </DCSection>
        <DCSection id="perfil" title="Perfil & Configurações" subtitle="Conta e PDF">
          <DCArtboard id="profile" label="Perfil" width={402} height={1192}><Phone h={1192}><ProfileScreen/></Phone></DCArtboard>
          <DCArtboard id="pdfset" label="Ajustes do PDF" width={402} height={746}><Phone h={746}><PdfSettingsScreen/></Phone></DCArtboard>
        </DCSection>
        <DCSection id="money" title="Monetização" subtitle="Conversão e pagamento">
          <DCArtboard id="premad" label="Anúncio Premium" width={402} height={862}><Phone h={862}><PremiumAdScreen/></Phone></DCArtboard>
          <DCArtboard id="pix" label="Pagamento PIX" width={402} height={938}><Phone h={938}><PixPaymentScreen/></Phone></DCArtboard>

        <DCSection id="suporte" title="Suporte & Mais" subtitle="Ajuda e onboarding">
          <DCArtboard id="chat" label="Chat de suporte" width={402} height={760}><Phone h={760}><SupportChatScreen/></Phone></DCArtboard>

          <DCArtboard id="privacy" label="Privacidade" width={402} height={790}><Phone h={790}><PrivacyScreen/></Phone></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
