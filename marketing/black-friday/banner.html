<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:600px;overflow:hidden}
body{font-family:Poppins,'Segoe UI',sans-serif;color:#fff;position:relative;
 background:
  radial-gradient(circle at 88% 18%,rgba(233,30,140,.55) 0,transparent 42%),
  radial-gradient(circle at 8% 110%,rgba(233,30,140,.35) 0,transparent 45%),
  linear-gradient(135deg,#141014 0%,#0a0a0a 60%,#1c0b16 100%);}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.6px);background-size:26px 26px}
.wrap{position:absolute;left:0;right:0;top:0;height:380px;display:flex;align-items:center;padding:0 110px;gap:40px}
.left{flex:1}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.brand img{height:54px;background:#fff;border-radius:14px;padding:6px 10px}
.brand span{font-weight:600;font-size:22px;letter-spacing:.5px;opacity:.85}
.bf{font-weight:900;font-size:104px;line-height:.95;letter-spacing:-1px;text-transform:uppercase}
.bf em{font-style:normal;color:#ff4fa3}
.sub{font-weight:500;font-size:28px;margin-top:18px;opacity:.92}
.sub b{font-weight:700;color:#fff}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:28px;background:#E91E8C;color:#fff;font-weight:700;font-size:26px;padding:14px 34px;border-radius:40px;box-shadow:0 10px 30px rgba(233,30,140,.45)}
.right{flex:0 0 330px;height:330px;margin-top:70px;position:relative;display:flex;align-items:center;justify-content:center}
.tag{width:310px;height:310px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7bbb 0,#E91E8C 45%,#a5136a 100%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);
 box-shadow:0 0 0 10px rgba(255,255,255,.08),0 25px 60px rgba(233,30,140,.5)}
.tag .n{font-weight:900;font-size:138px;line-height:.9;letter-spacing:-4px}
.tag .n small{font-size:72px;letter-spacing:0}
.tag .off{font-weight:800;font-size:44px;letter-spacing:6px;margin-top:2px}
.tag .pix{font-weight:600;font-size:22px;margin-top:6px;background:rgba(0,0,0,.25);padding:4px 16px;border-radius:20px}
.date{position:absolute;top:30px;right:40px;font-weight:700;font-size:22px;letter-spacing:2px;text-transform:uppercase;opacity:.7}
</style></head><body>
<div class="grid"></div>
<div class="date">27 a 30 de novembro</div>
<div class="wrap">
 <div class="left">
  <div class="brand"><img src="logo.png"><span>DocePreço</span></div>
  <div class="bf">Black<br><em>Friday</em></div>
 </div>
 <div class="right">
  <div class="tag"><div class="n">10<small>%</small></div><div class="off">OFF</div><div class="pix">no PIX</div></div>
 </div>
</div>
</body></html>
