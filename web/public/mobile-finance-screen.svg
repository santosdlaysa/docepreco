<svg viewBox="0 0 360 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="360" height="800" fill="#FFF6F0"/>

  <!-- Header -->
  <rect width="360" height="60" fill="#F57F17"/>
  <text x="180" y="40" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Financeiro</text>

  <!-- Resumo Mensal -->
  <rect x="15" y="75" width="330" height="100" rx="12" fill="white" stroke="#E0D5DD" stroke-width="1"/>

  <g id="summary">
    <!-- Receita -->
    <g>
      <circle cx="40" cy="105" r="18" fill="#E8F5D6"/>
      <text x="40" y="112" font-size="14" text-anchor="middle" fill="#43BE6E" font-weight="bold">↑</text>
      <text x="70" y="100" font-size="11" fill="#9A7E8C">Receita</text>
      <text x="70" y="120" font-size="16" font-weight="bold" fill="#3D2233">R$ 4.850</text>
    </g>

    <!-- Despesa -->
    <g>
      <circle cx="200" cy="105" r="18" fill="#FFEBEE"/>
      <text x="200" y="112" font-size="14" text-anchor="middle" fill="#EA4B92" font-weight="bold">↓</text>
      <text x="230" y="100" font-size="11" fill="#9A7E8C">Despesa</text>
      <text x="230" y="120" font-size="16" font-weight="bold" fill="#3D2233">R$ 1.250</text>
    </g>

    <!-- Lucro -->
    <g>
      <circle cx="310" cy="105" r="18" fill="#E0F5E1"/>
      <text x="310" y="112" font-size="14" text-anchor="middle" fill="#43BE6E" font-weight="bold">✓</text>
      <text x="265" y="155" font-size="11" fill="#9A7E8C" text-anchor="end">Lucro Líquido</text>
      <text x="265" y="175" font-size="14" font-weight="bold" fill="#43BE6E" text-anchor="end">R$ 3.600</text>
    </g>
  </g>

  <!-- Fluxo de Caixa -->
  <text x="15" y="210" font-size="13" font-weight="bold" fill="#3D2233">Fluxo de Caixa - Agosto</text>

  <!-- Entrada 1 -->
  <rect x="15" y="225" width="330" height="55" rx="8" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="252" r="16" fill="#E8F5D6"/>
  <text x="40" y="258" font-size="18" text-anchor="middle">💰</text>
  <text x="65" y="245" font-size="12" font-weight="bold" fill="#3D2233">Vendas - Receitas</text>
  <text x="65" y="260" font-size="10" fill="#9A7E8C">15 ago - 20:30</text>
  <text x="330" y="252" font-size="13" font-weight="bold" fill="#43BE6E" text-anchor="end">+R$ 750</text>

  <!-- Saída 1 -->
  <rect x="15" y="290" width="330" height="55" rx="8" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="317" r="16" fill="#FFEBEE"/>
  <text x="40" y="323" font-size="18" text-anchor="middle">📦</text>
  <text x="65" y="310" font-size="12" font-weight="bold" fill="#3D2233">Compra - Ingredientes</text>
  <text x="65" y="325" font-size="10" fill="#9A7E8C">14 ago - 14:15</text>
  <text x="330" y="317" font-size="13" font-weight="bold" fill="#EA4B92" text-anchor="end">-R$ 220</text>

  <!-- Entrada 2 -->
  <rect x="15" y="355" width="330" height="55" rx="8" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="382" r="16" fill="#E8F5D6"/>
  <text x="40" y="388" font-size="18" text-anchor="middle">💰</text>
  <text x="65" y="375" font-size="12" font-weight="bold" fill="#3D2233">Vendas - Brigadeiros</text>
  <text x="65" y="390" font-size="10" fill="#9A7E8C">13 ago - 18:00</text>
  <text x="330" y="382" font-size="13" font-weight="bold" fill="#43BE6E" text-anchor="end">+R$ 320</text>

  <!-- Saída 2 -->
  <rect x="15" y="420" width="330" height="55" rx="8" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="447" r="16" fill="#FFEBEE"/>
  <text x="40" y="453" font-size="18" text-anchor="middle">⚡</text>
  <text x="65" y="440" font-size="12" font-weight="bold" fill="#3D2233">Despesa - Embalagem</text>
  <text x="65" y="455" font-size="10" fill="#9A7E8C">12 ago - 09:30</text>
  <text x="330" y="447" font-size="13" font-weight="bold" fill="#EA4B92" text-anchor="end">-R$ 150</text>
</svg>