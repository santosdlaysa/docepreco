  <!-- Filtro -->
  <rect x="15" y="125" width="330" height="35" rx="6" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <text x="30" y="151" font-size="12" fill="#9A7E8C">Ordenar por: Mais recentes</text>
  <text x="330" y="151" font-size="14" text-anchor="end" fill="#2BA7DD">⚙️</text>

  <!-- Ingrediente 1 -->
  <rect x="15" y="175" width="330" height="75" rx="12" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="205" r="18" fill="#DAEAF5"/>
  <text x="40" y="212" font-size="20" text-anchor="middle">🥣</text>

  <text x="70" y="193" font-size="13" font-weight="bold" fill="#3D2233">Farinha de Trigo</text>
