  <text x="70" y="225" font-size="10" fill="#C4B0BB">Última atualização: 15 ago</text>

  <!-- Ingrediente 2 -->
  <rect x="15" y="265" width="330" height="75" rx="12" fill="white" stroke="#E0D5DD" stroke-width="1"/>
