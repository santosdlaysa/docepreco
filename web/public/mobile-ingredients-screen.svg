  <!-- Botão Adicionar -->
  <circle cx="330" cy="700" r="28" fill="#2BA7DD" opacity="0.9"/>
  <text x="330" y="710" font-size="32" text-anchor="middle" fill="white" font-weight="bold">+</text>
