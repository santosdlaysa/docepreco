  <text x="70" y="315" font-size="10" fill="#C4B0BB">Última atualização: 18 ago</text>

  <!-- Ingrediente 3 -->
  <rect x="15" y="355" width="330" height="75" rx="12" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="385" r="18" fill="#FFF3CC"/>
