  <text x="70" y="405" font-size="10" fill="#C4B0BB">Última atualização: 10 ago</text>

  <!-- Ingrediente 4 -->
  <rect x="15" y="445" width="330" height="75" rx="12" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="475" r="18" fill="#E8F5D6"/>
  <text x="40" y="482" font-size="20" text-anchor="middle">🥛</text>

  <text x="70" y="463" font-size="13" font-weight="bold" fill="#3D2233">Leite Integral</text>
