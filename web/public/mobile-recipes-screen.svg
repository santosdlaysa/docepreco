<svg viewBox="0 0 360 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="360" height="800" fill="#FFF6F0"/>

  <!-- Header -->
  <rect width="360" height="60" fill="#EA4B92"/>
  <text x="180" y="40" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Receitas</text>

  <!-- Search Bar -->
  <rect x="15" y="75" width="330" height="40" rx="8" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <text x="30" y="102" font-size="13" fill="#C4B0BB">🔍 Buscar receita...</text>

  <!-- Categoria Tabs -->
  <g id="tabs">
    <rect x="15" y="125" width="100" height="35" rx="6" fill="#EA4B92"/>
    <text x="65" y="151" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Todas</text>

    <rect x="125" y="125" width="100" height="35" rx="6" fill="white" stroke="#E0D5DD"/>
    <text x="175" y="151" font-size="12" fill="#9A7E8C" text-anchor="middle">Doces</text>

    <rect x="235" y="125" width="110" height="35" rx="6" fill="white" stroke="#E0D5DD"/>
    <text x="290" y="151" font-size="12" fill="#9A7E8C" text-anchor="middle">Salgados</text>
  </g>

  <!-- Receita 1 -->
  <rect x="15" y="175" width="330" height="90" rx="12" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="210" r="20" fill="#F0B6D2"/>
  <text x="40" y="215" font-size="24" text-anchor="middle" fill="white">🍫</text>

  <text x="70" y="195" font-size="14" font-weight="bold" fill="#3D2233">Bolo de Chocolate</text>
  <text x="70" y="210" font-size="11" fill="#9A7E8C">Custo: R$ 18,50</text>
  <text x="70" y="225" font-size="11" fill="#9A7E8C">Preço: R$ 65,00</text>
  <text x="70" y="240" font-size="11" fill="#43BE6E">Margem: 71%</text>

  <text x="330" y="210" font-size="18" text-anchor="end" fill="#EA4B92" font-weight="bold">→</text>

  <!-- Receita 2 -->
  <rect x="15" y="280" width="330" height="90" rx="12" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="315" r="20" fill="#FDBF99"/>
  <text x="40" y="320" font-size="24" text-anchor="middle" fill="white">🍪</text>

  <text x="70" y="300" font-size="14" font-weight="bold" fill="#3D2233">Cookies de Chocolate</text>
  <text x="70" y="315" font-size="11" fill="#9A7E8C">Custo: R$ 12,00</text>
  <text x="70" y="330" font-size="11" fill="#9A7E8C">Preço: R$ 35,00</text>
  <text x="70" y="345" font-size="11" fill="#43BE6E">Margem: 65%</text>

  <text x="330" y="315" font-size="18" text-anchor="end" fill="#EA4B92" font-weight="bold">→</text>

  <!-- Receita 3 -->
  <rect x="15" y="385" width="330" height="90" rx="12" fill="white" stroke="#E0D5DD" stroke-width="1"/>
  <circle cx="40" cy="420" r="20" fill="#FFE5CC"/>
  <text x="40" y="425" font-size="24" text-anchor="middle" fill="white">🍰</text>

  <text x="70" y="405" font-size="14" font-weight="bold" fill="#3D2233">Brigadeiro Gourmet</text>
  <text x="70" y="420" font-size="11" fill="#9A7E8C">Custo: R$ 8,50</text>
  <text x="70" y="435" font-size="11" fill="#9A7E8C">Preço: R$ 25,00</text>
  <text x="70" y="450" font-size="11" fill="#43BE6E">Margem: 66%</text>

  <text x="330" y="420" font-size="18" text-anchor="end" fill="#EA4B92" font-weight="bold">→</text>

  <!-- Botão Adicionar -->
  <circle cx="330" cy="700" r="28" fill="#EA4B92" opacity="0.9"/>
  <text x="330" y="710" font-size="32" text-anchor="middle" fill="white" font-weight="bold">+</text>
</svg>